<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" role="img" aria-labelledby="t d">
  <title id="t">Routing ladder</title>
  <desc id="d">The orchestrator plans and writes a brief. Scout sweeps for unknown locations. A Sonnet implementer does the work and a Sonnet verifier checks it. On a first FAIL the implementer is re-spawned fresh. After a second FAIL the Opus escalation agent takes over. If that also fails the orchestrator does the task itself.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .h { font-size: 15px; font-weight: 700; }
      .s { font-size: 12.5px; fill: #374151; }
      .l { font-size: 12px; font-weight: 600; }
      .box { stroke-width: 1.5; }
      .edge { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="820" height="700" fill="#ffffff"/>

  <!-- Orchestrator -->
  <rect class="box" x="250" y="20" width="320" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="h" x="410" y="46" text-anchor="middle">Orchestrator (Opus)</text>
  <text class="s" x="410" y="66" text-anchor="middle">plans, writes briefs, judges verdicts, integrates</text>

  <!-- Scout -->
  <rect class="box" x="640" y="20" width="160" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="720" y="46" text-anchor="middle">scout (Haiku)</text>
  <text class="s" x="720" y="66" text-anchor="middle">sweeps, read-only</text>
  <path class="edge" d="M570 40 L640 40"/>
  <path class="edge" d="M640 66 L570 66"/>
  <text class="s" x="605" y="32" text-anchor="middle">where is X?</text>
  <text class="s" x="605" y="84" text-anchor="middle">short brief</text>

  <!-- Brief -->
  <path class="edge" d="M410 84 L410 130"/>
  <text class="l" x="422" y="112">self-contained brief</text>

  <!-- Implementer -->
  <rect class="box" x="250" y="130" width="320" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="410" y="156" text-anchor="middle">sonnet-implementer (attempt 1)</text>
  <text class="s" x="410" y="176" text-anchor="middle">fresh context, runs the verify command</text>

  <!-- Verifier -->
  <path class="edge" d="M410 194 L410 240"/>
  <text class="l" x="422" y="222">diff summary + output</text>
  <rect class="box" x="250" y="240" width="320" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="410" y="266" text-anchor="middle">sonnet-verifier</text>
  <text class="s" x="410" y="286" text-anchor="middle">fresh context, cannot edit source: PASS or FAIL</text>

  <!-- PASS -->
  <path class="edge" d="M250 272 L130 272 L130 350"/>
  <text class="l" x="190" y="264" text-anchor="middle" style="fill:#15803d">PASS</text>
  <rect class="box" x="30" y="350" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="h" x="130" y="374" text-anchor="middle">Integrate / done</text>
  <text class="s" x="130" y="393" text-anchor="middle">orchestrator</text>

  <!-- FAIL 1 -->
  <path class="edge" d="M410 304 L410 350"/>
  <text class="l" x="422" y="332" style="fill:#b91c1c">FAIL #1: paste verifier output</text>
  <rect class="box" x="250" y="350" width="320" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="h" x="410" y="376" text-anchor="middle">sonnet-implementer (attempt 2)</text>
  <text class="s" x="410" y="396" text-anchor="middle">fresh spawn, not a continuation</text>

  <!-- Verify again -->
  <path class="edge" d="M410 414 L410 460"/>
  <text class="l" x="422" y="442">verify again</text>
  <rect class="box" x="250" y="460" width="320" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="410" y="490" text-anchor="middle">sonnet-verifier</text>
  <path class="edge" d="M250 485 L130 485 L130 410"/>
  <text class="l" x="190" y="477" text-anchor="middle" style="fill:#15803d">PASS</text>

  <!-- FAIL 2 -->
  <path class="edge" d="M410 510 L410 556"/>
  <text class="l" x="422" y="538" style="fill:#b91c1c">FAIL #2: attach both outputs</text>
  <rect class="box" x="250" y="556" width="320" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="h" x="410" y="580" text-anchor="middle">opus-escalation</text>
  <text class="s" x="410" y="598" text-anchor="middle">root-cause diagnosis, then fix and verify</text>

  <!-- Last resort -->
  <path class="edge" d="M410 608 L410 646"/>
  <text class="l" x="422" y="632">still failing</text>
  <rect class="box" x="250" y="646" width="320" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="h" x="410" y="672" text-anchor="middle">Orchestrator does it itself</text>

  <!-- Architecture-critical shortcut -->
  <path d="M556 84 L556 106 L720 106 L720 582 L570 582" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text class="s" x="708" y="400" text-anchor="end" style="fill:#b91c1c">architecture-critical:</text>
  <text class="s" x="708" y="416" text-anchor="end" style="fill:#b91c1c">skip straight to</text>
  <text class="s" x="708" y="432" text-anchor="end" style="fill:#b91c1c">opus-escalation</text>
</svg>
